<main class="container">

<div class="form">

<h1>Login / Create Account</h1>

<p class="muted">
New users get a unique Reading Room Member ID.
</p>

<input
id="name"
placeholder="Your name">

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<p class="small muted">
Existing account? Enter the same email and password to login.
New email creates an account.
</p>

<button class="btn" onclick="login()">
Login / Create Account
</button>
